name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      GDL_TEST_DATABASE_URL: postgresql+psycopg://gdl_test:gdl_test@localhost:5432/gdl_test
      GDL_AI_ENABLED: "false"
      GDL_AI_PROVIDER: rules

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gdl_test
          POSTGRES_USER: gdl_test
          POSTGRES_PASSWORD: gdl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gdl_test -d gdl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s backend/tests -t backend

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  browser:
    name: Browser and Real API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDL_E2E_DATABASE_URL: postgresql+psycopg://gdl_test:gdl_test@localhost:5432/gdl_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gdl_test
          POSTGRES_USER: gdl_test
          POSTGRES_PASSWORD: gdl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gdl_test -d gdl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies and browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run complete player journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Keep failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
